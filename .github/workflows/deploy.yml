# Deploys main to the EC2 box.
#
# Images are built HERE, never on the server. The box has 2 GB and `vite build`
# would exhaust it (ARCHITECTURE.md §14.4). The runner is ARM because the
# instance is Graviton — native arm64 runners are free on public repos, and
# they are roughly ten times faster than emulating arm64 on x86.
#
# Every image is tagged with the commit SHA, so a rollback is "deploy the
# previous SHA" rather than "rebuild and hope".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you redeploy by hand from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy midway

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and publish arm64 images
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.names.outputs.image_base }}

    steps:
      - uses: actions/checkout@v4

      # An image reference must be lowercase, and github.repository carries the
      # owner's capitalisation. Interpolating it directly produced a tag Docker
      # rejected before the build even started.
      - name: Compute the image base
        id: names
        run: |
          echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image_base }}-api:${{ github.sha }}
            ${{ steps.names.outputs.image_base }}-api:latest
          # Layer cache lives in Actions, so an unchanged requirements.txt
          # means pip install is skipped entirely on the next run.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image_base }}-web:${{ github.sha }}
            ${{ steps.names.outputs.image_base }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Runs ON the box, via a self-hosted runner registered to this repository.
  #
  # The runner polls GitHub outbound, so nothing new is exposed: port 22 stays
  # shut to everyone but the maintainer's own address, and there is no AWS
  # credential stored in GitHub at all.
  #
  # SAFETY: this repository is public, and a self-hosted runner will execute
  # whatever a workflow tells it to. That is only safe because this workflow
  # triggers on `push` to main and manual dispatch — never on `pull_request`.
  # A fork cannot push to main, so a fork cannot reach this machine. CI, which
  # does run on pull requests, stays on GitHub-hosted runners.
  # Do not add a pull_request trigger to this file.
  deploy:
    name: Roll out to EC2
    needs: build
    runs-on: [self-hosted, pharmacy-prod]
    permissions:
      contents: read
      packages: read      # the box pulls the images this token published

    steps:
      - uses: actions/checkout@v4

      - name: Pull, migrate, restart
        env:
          API_IMAGE: ${{ needs.build.outputs.image_base }}-api:${{ github.sha }}
          WEB_IMAGE: ${{ needs.build.outputs.image_base }}-web:${{ github.sha }}
        run: |
          set -euo pipefail

          # A package published by GITHUB_TOKEN is private until someone makes
          # it otherwise, so the box cannot pull anonymously. Authenticating is
          # one line and does not care either way, which beats depending on a
          # visibility setting nobody will remember is load-bearing.
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # Deploy from the home directory rather than this checkout. The
          # production secrets — database password, SECRET_KEY, SITE_ADDRESS —
          # live in ~/.env, and compose reads .env from the directory holding
          # the compose file. Running it here would start the stack with every
          # one of those silently unset.
          cp docker-compose.yml docker-compose.prod.yml ~/
          cd ~

          # Persist the tags so a manual `docker compose up` on the box uses the
          # same images CI deployed, rather than drifting to :latest.
          touch ~/.env
          sed -i '/^API_IMAGE=/d;/^WEB_IMAGE=/d' ~/.env
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> ~/.env

          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          # `up` runs the migrate service first and waits for it to succeed, so
          # the API never serves against a half-migrated schema.
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          docker image prune -f

      # `up -d` does not print what the migrate container did, so a deploy that
      # migrated and seeded looked exactly like one that skipped both. After a
      # release specifically about the server holding the same data as a
      # laptop, "it exited 0" was not enough to know whether it had.
      - name: What the seed did
        run: |
          cd ~
          echo "--- migrate container output ---"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            logs migrate --no-log-prefix --tail=60 || true

          echo
          echo "--- what is actually in the database ---"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            exec -T db psql -U pharmacy -d pharmacy -P pager=off -c "
              select
                (select count(*) from stock_movements)               as movements,
                (select count(*) from products where is_active)      as products,
                (select count(*) from products where not is_active)  as retired,
                (select count(distinct status) from stock_balances
                   where qty_on_hand > 0)                            as stock_statuses,
                (select count(*) from purchase_orders)               as purchase_orders,
                (select count(*) from recalls)                       as recalls;
            " || true

      - name: Container state on failure
        if: failure()
        run: |
          cd ~
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=40

  # Deliberately on a GitHub-hosted runner rather than the box. Checking the
  # site from the machine that is serving it proves the containers are up; it
  # does not prove anyone on the internet can reach them. This does.
  verify:
    name: Verify from outside
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test the public URL
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "https://${{ secrets.SITE_HOST }}/health/ready" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::health check never returned 200 — deployment is unhealthy"
          exit 1
